    description: The row's position in the publisher's file, from 0.
    type: number(id)
    examples:
    - 0
    - 1
    - 2
    - 3
    - 4
  - name: CASEID
    label: Case identification number
    type: number
    range:
    - 80716
    - 92062
    examples:
    - 80716
    - 92062
    details: |
      Universe: Applicable for all pregnancies

      Available: 2017-2019
    constraints:
    - primary_key
    - foreign_key
  - name: pregordr
    label: Pregnancy order (number)
    type: number(id)
    examples:
    - 1
    - 4
    - 7
    - 11
    - 14
    details: |
      Codes: 1 = 1ST PREGNANCY; 2 = 2ND PREGNANCY; 3 = 3RD PREGNANCY; 4 = 4TH PREGNANCY; 5 = 5TH PREGNANCY; 6 = 6TH PREGNANCY; 7 = 7TH PREGNANCY; 8 = 8TH PREGNANCY; 9 = 9TH PREGNANCY; 10 = 10TH PREGNANCY; 11 = 11TH PREGNANCY; 12 = 12TH PREGNANCY; 13 = 13TH PREGNANCY; 14 = 14TH PREGNANCY

      Universe: Applicable for all pregnancies

      Available: 2017-2019
    constraints:
    - primary_key
  - name: OUTCOME
    label: Pregnancy outcome
    type: number(id)
    examples:
    - 1
    - 2
    - 3
    - 5
    - 6
    details: |
      Codes: 1 = LIVE BIRTH; 2 = INDUCED ABORTION; 3 = STILLBIRTH; 4 = MISCARRIAGE; 5 = ECTOPIC PREGNANCY; 6 = CURRENT PREGNANCY

      Universe: Applicable for all pregnancies

      Available: 2017-2019
  - name: OUTCOME_I
    label: OUTCOME Imputation Flag
    type: number(id)
    examples:
    - 0
    - 1
    - 2
    details: |
      Codes: 0 = QUESTIONNAIRE DATA (NOT IMPUTED); 1 = MULTIPLE REGRESSION IMPUTATION; 2 = LOGICAL IMPUTATION

      Universe: Applicable for all pregnancies

      Available: 2017-2019
  - name: BIRTHORD
    label: Birth order
    type: number(quantity)
    range:
    - 1
    - 11
    details: |
      Codes: 1 = 1ST BIRTH; 2 = 2ND BIRTH; 3 = 3RD BIRTH; 4 = 4TH BIRTH; 5 = 5TH BIRTH; 6 = 6TH BIRTH; 7 = 7TH BIRTH; 8 = 8TH BIRTH; 9 = 9TH BIRTH; 10 = 10TH BIRTH; 11 = 11TH BIRTH

      Universe: Applicable for all pregnancies that resulted in live birth (OUTCOME = 1)

      Available: 2017-2019
  - name: BIRTHORD__code
    label: 'Birth order: missing code'
    description: 'Why `BIRTHORD` is missing for this row: the code as published, as text. Null where the
      answer is valid. Labels end with the missing types in brackets.'
    type: enum
    values:
      .: INAPPLICABLE [inap]
    details: Codes classified by rule:nsfg_missing_from_labels@0.1.
  - name: AGEPREG
    label: Age at pregnancy outcome
    type: number(quantity)
    range:
    - 0
    - 49
    details: |
      Universe: Applicable if pregnancy is a completed pregnancy (OUTCOME NE 6)

      Available: 2017-2019
  - name: AGEPREG__code
    label: 'Age at pregnancy outcome: missing code'
    description: 'Why `AGEPREG` is missing for this row: the code as published, as text. Null where the
      answer is valid. Labels end with the missing types in brackets.'
    type: enum
    values:
      .: INAPPLICABLE [inap]
    details: Codes classified by rule:nsfg_missing_from_labels@0.1.
  - name: PMARPREG
    label: Whether pregnancy ended before R's 1st marriage (premaritally)
    type: number(id)
    examples:
    - 1
    - 2
    details: |
      Codes: 1 = YES; 2 = No

      Universe: Applicable if pregnancy is a completed pregnancy (OUTCOME NE 6)

      Available: 2017-2019
  - name: PMARPREG__code
    label: 'Whether pregnancy ended before R''s 1st marriage (premaritally): missing code'
    description: 'Why `PMARPREG` is missing for this row: the code as published, as text. Null where the
      answer is valid. Labels end with the missing types in brackets.'
    type: enum
    values:
      .: INAPPLICABLE [inap]
    details: Codes classified by rule:nsfg_missing_from_labels@0.1.
  - name: WGT2017_2019
    label: Final weight for the 2017-2019 NSFG
    type: number(quantity)
    range:
    - 1340.862
    - 83332.13
    details: |
      Universe: Applicable for all Respondents

      Available: 2017-2019
  - name: SECU
    label: Randomized version of the sampling error computational unit
    type: number(id)
    examples:
    - 1
    - 2
    - 3
    - 4
    details: |
      Codes: 1 = 1; 2 = 2; 3 = 3; 4 = 4

      Universe: Applicable for all pregnancies (respondent-level variable)

      Available: 2017-2019
  - name: SEST
    label: Randomized version of the stratum
    type: number
    range:
    - 302
    - 371
    examples:
    - 302
    - 371
    details: |
      Universe: Applicable for all pregnancies (respondent-level variable)

      Available: 2017-2019
  - name: RELIGION
    label: Current religious affiliation
    type: number(id)
    examples:
    - 1
    - 2
    - 3
    - 4
    details: |
      Codes: 1 = NO RELIGION; 2 = CATHOLIC; 3 = PROTESTANT; 4 = OTHER RELIGIONS

      Universe: Applicable for all pregnancies (respondent-level variable)

      Available: 2017-2019
relationships:
- join: pregnancy.CASEID = female.CASEID
  cardinality: many-to-one
glossary:
  missing type dk: The respondent didn't know or couldn't choose.
  missing type inap: 'Not applicable: outside the universe or skipped by design.'
  missing type no_answer: No answer recorded, reason unknown.
  missing type refused: The respondent refused.
