          - {source: nsfg-2017-2019-male-codebook-weights, path: cdc/2017-2019_NSFG_Male_SectionWeights_Codebook-508.txt}
        data: {source: nsfg-2017-2019-male-dat, path: 2017_2019_MaleData.dat,
               dictionary: {source: nsfg-2017-2019-male-dct, path: 2017_2019_MaleSetup.dct}}
        variables:
          design: [CASEID, WGT2017_2019, SECU, SEST, AGE_R, HISPRACE2, HIEDUC]
