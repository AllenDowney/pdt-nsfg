      Codes: 5 = 9TH GRADE OR LESS; 6 = 10TH GRADE; 7 = 11TH GRADE; 8 = 12TH GRADE, NO DIPLOMA (NOR GED); 9 = HIGH SCHOOL GRADUATE (DIPLOMA OR GED); 10 = SOME COLLEGE BUT NO DEGREE; 11 = ASSOCIATE DEGREE IN COLLEGE/UNIVERSITY; 12 = BACHELOR'S DEGREE; 13 = MASTER'S DEGREE; 14 = DOCTORATE DEGREE; 15 = PROFESSIONAL DEGREE

