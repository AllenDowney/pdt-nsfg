# The snake_case slice of the NSFG (PublicDataToolkit Tasks 5 and 22).
# Two releases, each with three tables. Hand-entered facts are recorded with
# origin: hand, by each release's author. Paths are relative to data/raw/; a
# .pdf is converted to text with `pdftotext -layout` the first time it's read.

releases:
  "2022-2023":
    author: Claude (PublicDataToolkit Task 5)
    date: "2026-11-19"
    codebook_format: nchs        # one text codebook per table; no question text
    tables:
      female:
        codebook: [{source: nsfg-female-codebook, path: 2022-2023-FemResp-Codebook.txt}]
        data: {source: nsfg-female-sas, path: NSFG-2022-2023-FemRespPUFData.sas7bdat}
        questionnaire: {source: nsfg-2022-2023-female-capilite, path: cdc/2022-2023-NSFG-Capilite-FemaleQuestionnaire.txt}
        variables:
          design: [CaseID, WGT2022_2023, VEST, VECL, AGE_R, RSCRAGE, HISPRACE2, HIEDUC, HIEDUC_I]
          marital: [MARSTAT, LMARSTAT, EVRMARRY, FMARITAL, RMARITAL, FMARIT, RMARIT, SSMARCOH, CURRPRTS]
          religion: [RELIGION, ATTND14, RELDLIFE, ATTNDNOW]
          other: [POT12, SAMLIFENUM]
          marriagensfg: [CMINTVW, AGER, PARITY, MARDAT01, MAREND01, MARDIS01, FMARNO, NCHILDHH, INTENT, ADDEXP,
                         STRLOPER, TUBS, HYST, RWANT, FTFMODE]
      male:
        codebook: [{source: nsfg-male-codebook, path: 2022-2023-Male-Codebook.txt}]
        data: {source: nsfg-male-sas, path: NSFG-2022-2023-MaleRespPUFData.sas7bdat}
        questionnaire: {source: nsfg-2022-2023-male-capilite, path: cdc/2022-2023-NSFG-Capilite-MaleQuestionnaire.txt}
        variables:
          design: [CaseID, WGT2022_2023, VEST, VECL, AGE_R, HISPRACE2, HIEDUC]
          marital: [MARSTAT, LMARSTAT, EVRMARRY, FMARITAL, RMARITAL]
          religion: [RELIGION, ATTND14, RELDLIFE, ATTNDNOW]
          other: [POT12, MFLASTP]
          marriagensfg: [MARDAT01, CMINTVW, AGER, MAREND01, FMARNO, mar1diss, ADDEXP, INTENT, EVBIOKID, NUMBIOKID,
                         EVEROPER, RWANT, FTFMODE]
      pregnancy:
        codebook: [{source: nsfg-pregnancy-codebook, path: 2022-2023-FemPreg-Codebook.txt}]
        data: {source: nsfg-pregnancy-sas, path: NSFG-2022-2023-FemPregPUFData.sas7bdat}
        questionnaire: {source: nsfg-2022-2023-female-capilite, path: cdc/2022-2023-NSFG-Capilite-FemaleQuestionnaire.txt}
        variables:
          keys: [CaseID, PREGORDR]
          outcome: [OUTCOME, OUTCOME_I, BIRTHORD, BABYSEX, BIRTHWGT, agepreg, pmarpreg]
          design: [WGT2022_2023, VEST, VECL, RELIGION]

  # The same variables where they exist under the same name, plus this cycle's
  # weight and design variables (it has SECU and SEST, not VEST). Names are
  # written as this cycle's codebook writes them.
