# The snake_case slice of the NSFG (PublicDataToolkit Tasks 5 and 22).
# Two releases, each with three tables. Hand-entered facts are recorded with
# origin: hand, by each release's author. Paths are relative to data/raw/; a
# .pdf is converted to text with `pdftotext -layout` the first time it's read.

releases:
  "2022-2023":
    author: Allen Downey
    date: "2026-11-19"
    codebook_format: nchs        # one text codebook per table; no question text
    tables:
      female:
        codebook: [{source: nsfg-female-codebook, path: 2022-2023-FemResp-Codebook.txt}]
        data: {source: nsfg-female-sas, path: NSFG-2022-2023-FemRespPUFData.sas7bdat}
        questionnaire: {source: nsfg-2022-2023-female-capilite, path: cdc/2022-2023-NSFG-Capilite-FemaleQuestionnaire.txt}
        variables:
          design: [CaseID, WGT2022_2023, VEST, AGE_R, RSCRAGE, HISPRACE2, HIEDUC, HIEDUC_I]
          marital: [MARSTAT, LMARSTAT, EVRMARRY, FMARITAL, RMARITAL, FMARIT, RMARIT, SSMARCOH, CURRPRTS]
          religion: [RELIGION, ATTND14, RELDLIFE, ATTNDNOW]
          other: [POT12, SAMLIFENUM]
      male:
        codebook: [{source: nsfg-male-codebook, path: 2022-2023-Male-Codebook.txt}]
        data: {source: nsfg-male-sas, path: NSFG-2022-2023-MaleRespPUFData.sas7bdat}
        questionnaire: {source: nsfg-2022-2023-male-capilite, path: cdc/2022-2023-NSFG-Capilite-MaleQuestionnaire.txt}
        variables:
          design: [CaseID, WGT2022_2023, VEST, AGE_R, HISPRACE2, HIEDUC]
          marital: [MARSTAT, LMARSTAT, EVRMARRY, FMARITAL, RMARITAL]
          religion: [RELIGION, ATTND14, RELDLIFE, ATTNDNOW]
          other: [POT12, MFLASTP]
      pregnancy:
        codebook: [{source: nsfg-pregnancy-codebook, path: 2022-2023-FemPreg-Codebook.txt}]
        data: {source: nsfg-pregnancy-sas, path: NSFG-2022-2023-FemPregPUFData.sas7bdat}
        questionnaire: {source: nsfg-2022-2023-female-capilite, path: cdc/2022-2023-NSFG-Capilite-FemaleQuestionnaire.txt}
        variables:
          keys: [CaseID, PREGORDR]
          outcome: [OUTCOME, OUTCOME_I, BIRTHORD, BABYSEX, BIRTHWGT, agepreg, pmarpreg]
          design: [WGT2022_2023, VEST, RELIGION]

  # The same variables where they exist under the same name, plus this cycle's
  # weight and design variables (it has SECU and SEST, not VEST). Names are
  # written as this cycle's codebook writes them.
  "2017-2019":
    author: Claude (PublicDataToolkit Task 22) for Allen Downey
    date: "2026-11-19"
    codebook_format: icpsr       # several section codebooks per table, with question text
    tables:
      female:
        codebook:
          - {source: nsfg-2017-2019-female-codebook-screener, path: cdc/2017-2019_NSFG_FemResp_Screener_Codebook-508.txt}
          - {source: nsfg-2017-2019-female-codebook-a, path: cdc/2017-2019_NSFG_FemResp_SectionA_Codebook-508.txt}
          - {source: nsfg-2017-2019-female-codebook-c, path: cdc/2017-2019_NSFG_FemResp_SectionC_Codebook-508.txt}
          - {source: nsfg-2017-2019-female-codebook-i, path: cdc/2017-2019_NSFG_FemResp_SectionI_Codebook-508.txt}
          - {source: nsfg-2017-2019-female-codebook-j, path: cdc/2017-2019_NSFG_FemResp_SectionJ_Codebook-508.txt}
          - {source: nsfg-2017-2019-female-codebook-recodes, path: cdc/2017-2019_NSFG_FemResp_SectionRecodes_Codebook-508.txt}
          - {source: nsfg-2017-2019-female-codebook-weights, path: cdc/2017-2019_NSFG_FemResp_SectionWeights_Codebook-508.txt}
        data: {source: nsfg-2017-2019-female-dat, path: 2017_2019_FemRespData.dat,
               dictionary: {source: nsfg-2017-2019-female-dct, path: 2017_2019_FemRespSetup.dct}}
        variables:
          design: [CASEID, WGT2017_2019, SECU, SEST, AGE_R, RSCRAGE, HISPRACE2, HIEDUC, HIEDUC_I]
          marital: [MARSTAT, EVRMARRY, FMARITAL, RMARITAL, FMARIT, CURRPRTS]
          religion: [RELIGION, ATTND14, RELDLIFE, ATTNDNOW]
          other: [POT12, SAMLIFENUM]
      male:
        codebook:
          - {source: nsfg-2017-2019-male-codebook-screener, path: cdc/2017-2019_NSFG_Male_Screener_Codebook-508.txt}
          - {source: nsfg-2017-2019-male-codebook-a, path: cdc/2017-2019_NSFG_Male_SectionA_Codebook-508.txt}
          - {source: nsfg-2017-2019-male-codebook-j, path: cdc/2017-2019_NSFG_Male_SectionJ_Codebook-508.txt}
          - {source: nsfg-2017-2019-male-codebook-k, path: cdc/2017-2019_NSFG_Male_SectionK_Codebook-508.txt}
          - {source: nsfg-2017-2019-male-codebook-recodes, path: cdc/2017-2019_NSFG_Male_SectionRecodes_Codebook-508.txt}
          - {source: nsfg-2017-2019-male-codebook-weights, path: cdc/2017-2019_NSFG_Male_SectionWeights_Codebook-508.txt}
        data: {source: nsfg-2017-2019-male-dat, path: 2017_2019_MaleData.dat,
               dictionary: {source: nsfg-2017-2019-male-dct, path: 2017_2019_MaleSetup.dct}}
        variables:
          design: [CASEID, WGT2017_2019, SECU, SEST, AGE_R, HISPRACE2, HIEDUC]
          marital: [MARSTAT, EVRMARRY, FMARITAL, RMARITAL]
          religion: [RELIGION, ATTND14, RELDLIFE, ATTNDNOW]
          other: [POT12, MFLASTP]
      pregnancy:
        codebook:
          - {source: nsfg-2017-2019-pregnancy-codebook, path: cdc/2017-2019_NSFG_FemPregFile_Codebook-508.txt}
        data: {source: nsfg-2017-2019-pregnancy-dat, path: 2017_2019_FemPregData.dat,
               dictionary: {source: nsfg-2017-2019-pregnancy-dct, path: 2017_2019_FemPregSetup.dct}}
        variables:
          keys: [CASEID, PREGORDR]
          outcome: [OUTCOME, OUTCOME_I, BIRTHORD, AGEPREG, PMARPREG]
          design: [WGT2017_2019, SECU, SEST, RELIGION]

# By name, ignoring case; the same for every release.
measure:
  identifier: [CaseID, PREGORDR]
  weight: [WGT2022_2023, WGT2017_2019]
  continuous: [AGE_R, RSCRAGE, agepreg, BIRTHWGT]
  count: [SAMLIFENUM, CURRPRTS, BIRTHORD]
  ordinal: [HIEDUC, ATTND14, RELDLIFE, ATTNDNOW, POT12]
  categorical: [MFLASTP, VEST, SECU, SEST, HISPRACE2, HIEDUC_I, MARSTAT, LMARSTAT, EVRMARRY, FMARITAL, RMARITAL,
                FMARIT, RMARIT, SSMARCOH, RELIGION, OUTCOME, OUTCOME_I, BABYSEX, pmarpreg]

# Links NCHS asserts in its "Summary of NSFG Questionnaire Changes for 2022-2023
# (relative to 2017-2019 NSFG)" (source nsfg-2022-2023-quex-changes). Each names
# the 2017-2019 and 2022-2023 variables, in each of the tables listed.
# Relations the summary doesn't state come from comparing the two codebooks;
# the note says which.
publisher_links:
  - tables: [female, male]
    from: MARSTAT
    to: MARSTAT
    relations: [wording_changed, codes_changed]
    location: "Changes affecting both male & female questionnaires, p. 1"
    quote: "Revised marital and cohabiting status questions (Section A) to be more inclusive of same-sex spouses and partners. ... MARSTAT now asks about spouse/partner regardless of sex"
    note: >
      wording_changed is what the summary states. codes_changed is from the two
      codebooks: 1-6 (married, cohabiting, widowed, divorced, separated, never
      married) in 2017-2019; 1-3 (married, living together, neither) in 2022-2023.
