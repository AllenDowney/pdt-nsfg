        # Hand-checked layout fixes (origin hand, Claude, PublicDataToolkit Task 75, 2026-11-20).
        # The setup program gives F22_1CM as columns 622-628, which overlaps F21_1CM (619-622). In the
        # data (rec_type 0) its four-digit codes (9797, 9898, 9999, and century months like 0990) are in
        # 625-628; 623-624 hold two digits only where F21_1CM is filled, and no variable is assigned there.
        layout_fixes:
          F22_1CM: {start: 625, end: 628, was: "622-628"}
        variables:
          marriagensfg: [CASEID, FINALWT, AGE, MAR2P, FMAR1MO, FMARITAL, R7_CM, CMBIRTH, F18_1, F21_1CM, F22_1CM, FMARNO, MARITAL, PARITY, INTENT, ADDEXP, AGEBABY1, STRLOPER, WANTKID2, EDUCAT]

# By name, ignoring case; the same for every release.
measure:
  identifier: [CaseID, PREGORDR]
  weight: [WGT2022_2023, WGT2017_2019, FINALWT, W5, POST_WT, FINALWGT, WGTQ1Q16, WGT2011_2013, WGT2013_2015, WGT2015_2017]
  continuous: [AGE_R, RSCRAGE, agepreg, BIRTHWGT, AGE, A_5, AGER, MAR2P, AGEBABY1, ADDEXP, FMAR1MO, R7_CM, CMBIRTH, F21_1CM, F22_1CM, F15MO, F19M1MO, QDICMO, A_3, F26M1MO, F27M1MO, A_DOI, MARDAT01, BDAYCENM, DIVDATH1, WNSTPH1, CMMARRHX, CMDIVORCX, CMINTVW, MARDIS01, MAR1DISS, CMDIVW, NUMBIOKID]
  count: [EDUCAT, SAMLIFENUM, CURRPRTS, BIRTHORD, FMARNO, PARITY, TIMESMAR, NCHILDHH, BIOKIDS, EVRCHILN]
  ordinal: [HIEDUC, ATTND14, RELDLIFE, ATTNDNOW, POT12, HIDEGREE, DEGREES]
  categorical: [MFLASTP, VEST, VECL, SECU, SEST, HISPRACE2, HIEDUC_I, MARSTAT, LMARSTAT, EVRMARRY, FMARITAL, RMARITAL,
                FMARIT, RMARIT, SSMARCOH, RELIGION, OUTCOME, OUTCOME_I, BABYSEX, pmarpreg, MARITAL, F18_1, F23M1, MAREND01, MARREND4, INTENT, STRLOPER, STEROPEV, WANTKID2, TUBS, HYST, RWANT, HAVEDEG, EVRCHIL, EVEROPER, FTFMODE, EVBIOKID]

# Links NCHS asserts in its "Summary of NSFG Questionnaire Changes for 2022-2023
# (relative to 2017-2019 NSFG)" (source nsfg-2022-2023-quex-changes). Each names
# the 2017-2019 and 2022-2023 variables, in each of the tables listed.
# Relations the summary doesn't state come from comparing the two codebooks;
# the note says which.
publisher_links:
  - tables: [female, male]
    from: MARSTAT
    to: MARSTAT
    relations: [wording_changed, codes_changed]
    location: "Changes affecting both male & female questionnaires, p. 1"
    quote: "Revised marital and cohabiting status questions (Section A) to be more inclusive of same-sex spouses and partners. ... MARSTAT now asks about spouse/partner regardless of sex"
    note: >
      wording_changed is what the summary states. codes_changed is from the two
      codebooks: 1-6 (married, cohabiting, widowed, divorced, separated, never
      married) in 2017-2019; 1-3 (married, living together, neither) in 2022-2023.

# Links entered by hand (origin: hand), where the rule's comparison isn't enough.
# PublicDataToolkit Task 35: in 2022-2023 these labels count only opposite-sex
# spouses ("Ever married to an opposite-sex spouse"); in 2017-2019 they didn't say.
# That's a change of meaning: who counts as married changed. The build quotes both
# labels in each link's note.
hand_links:
  - tables: [female, male]
    name: EVRMARRY
    relations: [labels_changed, universe_changed]
    author: Claude (PublicDataToolkit Task 35)
    date: "2026-11-19"
    note: Decided in PublicDataToolkit Task 35 by Claude, at the coordinator thread's request.
  - tables: [female, male]
    name: FMARITAL
    relations: [labels_changed, universe_changed]
    author: Claude (PublicDataToolkit Task 35)
    date: "2026-11-19"
    note: Decided in PublicDataToolkit Task 35 by Claude, at the coordinator thread's request.
  - tables: [female]
    name: FMARIT
    relations: [labels_changed, universe_changed]
    author: Claude (PublicDataToolkit Task 35)
    date: "2026-11-19"
    note: The same change as FMARITAL's; added in PublicDataToolkit Task 35.
