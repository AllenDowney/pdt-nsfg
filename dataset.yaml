                  nsfg-2017-2019-male-codebook-j, nsfg-2017-2019-male-codebook-k,
                  nsfg-2017-2019-male-codebook-b, nsfg-2017-2019-male-codebook-f, nsfg-2017-2019-male-codebook-h, nsfg-2017-2019-male-codebook-recodes, nsfg-2017-2019-male-codebook-weights,
                  nsfg-2017-2019-male-dat, nsfg-2017-2019-male-dct]
        key: [CASEID]
      - id: pregnancy
        label: Pregnancies reported by female respondents
        sources: [nsfg-2017-2019-pregnancy-codebook, nsfg-2017-2019-pregnancy-dat, nsfg-2017-2019-pregnancy-dct]
        key: [CASEID, pregordr]
        references:
          - columns: [CASEID]
            table: female
